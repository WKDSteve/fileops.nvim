name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  test:
    name: tests (headless, ${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    strategy:
      # One platform failing must not cancel the others: which of the three
      # broke is the whole information content of this job. This plugin is
      # file operations end to end -- rename, trash, permissions -- so a
      # platform-specific break here is the likeliest kind there is.
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    defaults:
      run:
        # Windows runners default to PowerShell, where scripts/test.sh (a bash
        # script) would not even start. One shell on
        # all three keeps the run step itself from being the thing that
        # differs between platforms.
        shell: bash
    steps:
      - uses: actions/checkout@v5
        with:
          path: fileops.nvim
      # scripts/test.sh hard-fails without lib.nvim (a real runtime
      # dependency, not just optional) -- check it out as a sibling so the
      # lookup (../lib.nvim) finds it.
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: lib.nvim
          ref: ci-verified
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      - name: Run TESTS suite
        working-directory: fileops.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          bash scripts/test.sh --json "$RUNNER_TEMP/testing-ir.json"
      - name: Conformance gate
        working-directory: fileops.nvim
        run: bash scripts/test.sh conformance
      # Regression gate for the surface (docs/SURFACE.md of testing.nvim): a command, keymap or autocommand that the specs
      # exercised when surface.baseline.json was written must still be exercised. Linux only: the baseline comes from
      # the Linux run. To accept an intended change, rewrite the file from a green Linux run (`scripts/test.sh surface
      # --from <ir> --write-baseline surface.baseline.json`, IR = the surface-ir artifact) and review the diff.
      - name: Surface baseline gate
        if: matrix.os == 'ubuntu-latest'
        working-directory: fileops.nvim
        run: bash scripts/test.sh surface --from "$RUNNER_TEMP/testing-ir.json" --baseline surface.baseline.json --require-signed-baseline
      # The IR of the Linux run carries the surface the specs exercised: the baseline (surface.baseline.json) is
      # written from exactly this artifact, so it matches what the runner measures.
      - uses: actions/upload-artifact@v7
        if: matrix.os == 'ubuntu-latest' && always()
        with:
          name: surface-ir
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 7
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-${{ matrix.os }}
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-test-${{ matrix.os }}
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  explorer-integration:
    name: tests (neo-tree + nvim-tree, headless)
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5
        with:
          path: fileops.nvim
      - uses: actions/checkout@v5
        with:
          repository: WKDSteve/lib.nvim
          path: lib.nvim
          ref: ci-verified
      # explorer_integration_spec.lua's own subject: exercises ops/file.lua's
      # explorer-refresh code path against REAL neo-tree.nvim/nvim-tree.lua
      # instances, not just the `package.loaded[...]`-guarded no-op the rest
      # of the suite exercises. Checked out as siblings, same lookup order
      # the spec itself uses (`$<NAME>_DIR` first, sibling checkout second) —
      # nui.nvim and plenary.nvim are neo-tree's own hard dependencies.
      - uses: actions/checkout@v5
        with:
          repository: nvim-neo-tree/neo-tree.nvim
          path: neo-tree.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 162f9b953a692b559afe43e38d60afee81e8e79b
      - uses: actions/checkout@v5
        with:
          repository: nvim-tree/nvim-tree.lua
          path: nvim-tree.lua
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 8d814495983e8db87d02d2f1da293f25b2fd1bdc
      - uses: actions/checkout@v5
        with:
          repository: MunifTanjim/nui.nvim
          path: nui.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 10fc361835c856ba4233ef5ea135b919bf3dce97
      - uses: actions/checkout@v5
        with:
          repository: nvim-lua/plenary.nvim
          path: plenary.nvim
          # Pinned to the 2026-09-20 HEAD; bump deliberately, not by drifting.
          ref: 74b06c6c75e4eeb3108ec01852001636d85a932b
      - uses: rhysd/action-setup-vim@v1
        with:
          neovim: true
          version: stable
      # Checked out from the branch that only moves once the dependency's own CI is green.
      - uses: actions/checkout@v5
        with:
          repository: "WKDSteve/testing.nvim"
          path: testing.nvim
          ref: ci-verified
      - name: Run TESTS suite (with explorer deps on rtp)
        working-directory: fileops.nvim
        # Explicit locations: the spec's own sibling lookup resolves the repo
        # root one directory too high (three `:h` on a path that already ends
        # in `TESTS/`), so the checkouts next to this repo are never found
        # that way and this job used to skip the spec silently. The env
        # override is the lookup that works.
        env:
          NEO_TREE_NVIM_DIR: ${{ github.workspace }}/neo-tree.nvim
          NVIM_TREE_LUA_DIR: ${{ github.workspace }}/nvim-tree.lua
          NUI_NVIM_DIR: ${{ github.workspace }}/nui.nvim
          PLENARY_NVIM_DIR: ${{ github.workspace }}/plenary.nvim
        run: |
          exec > >(tee -a "$RUNNER_TEMP/test-output.log") 2>&1
          # --strict: here a skip means the explorer checkouts were not found,
          # which must be red, not a quiet pass of the one spec this job is for.
          # --guard state=off: --strict would turn the state guard's warnings (one
          # shared editor, isolated = "none", see .testing.lua) into failures.
          bash scripts/test.sh --strict --guard state=off --json "$RUNNER_TEMP/testing-ir.json"
      # The IR is what a reporter or a person reads to find out WHICH case failed on WHICH platform.
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: testing-ir-explorer-integration
          path: ${{ runner.temp }}/testing-ir.json
          if-no-files-found: ignore
          retention-days: 14
      - uses: actions/upload-artifact@v7
        if: failure()
        with:
          name: test-output-explorer-integration
          path: ${{ runner.temp }}/test-output.log
          if-no-files-found: ignore
          retention-days: 14

  lint:
    name: lint (stylua + luacheck)
    runs-on: ubuntu-latest
    timeout-minutes: 30
    # Was advisory while the one-time `stylua .` pass the existing style
    # predated was still outstanding. That pass has landed, `stylua --check .`
    # and `luacheck lua` both run clean, and leaving the job non-blocking would
    # only let the formatting drift back unnoticed.
    steps:
      - uses: actions/checkout@v5
      - name: stylua --check
        uses: JohnnyMorganz/stylua-action@v5
        with:
          # Required by the action to fetch the release; without it the step
          # fails with "Parameter token or opts.auth is required" before ever
          # running stylua. It went unnoticed while the job was advisory.
          token: ${{ secrets.GITHUB_TOKEN }}
          # Pinned, not "latest": stylua's own rule changes between releases
          # would otherwise turn this gate red with no local diff to blame.
          version: v2.5.2
          args: --check .
      - name: luacheck
        run: |
          sudo apt-get update
          sudo apt-get install -y lua-check
          luacheck lua
